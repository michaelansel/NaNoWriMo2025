name: AI review
description: >-
  Run the Continuity and Style editors on the exe runner and publish the result, or, when
  the probe chose "hosted", publish "AI review unavailable" and fail. Expects the repository
  checked out and a story-preview artifact (dist/, lib/artifacts/) in this workflow run.
  The job must export GITHUB_TOKEN for the GitHub calls.

inputs:
  runner:
    description: The probe's decision, exe or hosted.
    required: true
  unavailable-reason:
    description: The probe's reason when runner is hosted.
    default: ""
  mode:
    description: changed, all or passage.
    default: changed
  passage:
    description: Passage name for mode=passage.
    default: ""
  pr:
    description: Pull request number; empty publishes to the step summary only.
    default: ""
  head-sha:
    description: Commit for the check runs (default resolved from the pull request).
    default: ""
  artifact-name:
    description: Name for the uploaded ai-review.json artifact.
    required: true
  previous-run-id:
    description: >-
      For mode=passage: the workflow run holding the pull request's last artifact-name
      artifact, which the re-check is merged into. Empty: no earlier review, so the
      re-check is published as partial. The job needs actions: read.
    default: ""
  llm-profile:
    description: NANOIF_LLM_PROFILE (vars.LLM_PROFILE, default exe).
    default: exe
  llm-model:
    description: NANOIF_LLM_MODEL (vars.LLM_MODEL); empty uses the profile default.
    default: ""
  python-version:
    description: Python for the hosted path (the exe VM uses its own python3 in a venv).
    default: "3.13"

runs:
  using: composite
  steps:
    - name: Python venv (exe runner)
      if: inputs.runner == 'exe'
      shell: bash
      run: |
        # actions/setup-python needs a hosted-style tool cache; the VM's python3 (3.12)
        # meets requires-python >= 3.11, so a fresh venv per job is enough.
        python3 -m venv "$RUNNER_TEMP/venv"
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

    - name: Set up Python (hosted)
      if: inputs.runner != 'exe'
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip

    - name: Install nanoif
      shell: bash
      run: python -m pip install -e .

    - name: Report AI review unavailable
      if: inputs.runner != 'exe'
      shell: bash
      env:
        PR: ${{ inputs.pr }}
        HEAD_SHA: ${{ inputs.head-sha }}
        REASON: ${{ inputs.unavailable-reason }}
      run: |
        args=(--reason "${REASON:-exe runner offline}")
        if [ -n "$PR" ]; then args+=(--pr "$PR"); fi
        if [ -n "$HEAD_SHA" ]; then args+=(--head-sha "$HEAD_SHA"); fi
        nanoif github unavailable "${args[@]}"
        echo "::error::AI review unavailable: ${REASON:-exe runner offline}"
        exit 1

    - name: Download the build output
      if: inputs.runner == 'exe'
      uses: actions/download-artifact@v8
      with:
        name: story-preview
        path: .

    - name: Download the last AI review (passage re-check)
      id: previous
      if: inputs.runner == 'exe' && inputs.mode == 'passage' && inputs.previous-run-id != ''
      # A failed download is reported by the merge step (warning and step summary) and the
      # re-check is then published labelled partial, never as a full result.
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact-name }}
        run-id: ${{ inputs.previous-run-id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/previous-review

    - name: Estimate the cost of reviewing every passage
      # /check-continuity all states its estimated cost before the run
      # (AC-continuity-review-11). When the estimate does not fit under this month's AI
      # spend cap, or the spend ledger cannot be read, it writes ai-review.json with both
      # editors not run and the reason, calls no model and exits 1; the review below does
      # not start and the publish step posts that result (AC-continuity-review-35).
      id: estimate
      if: inputs.runner == 'exe' && inputs.mode == 'all'
      shell: bash
      env:
        NANOIF_LLM_PROFILE: ${{ inputs.llm-profile }}
        NANOIF_LLM_MODEL: ${{ inputs.llm-model }}
        NANOIF_RUNNER: exe
      run: |
        rm -f dist/ai-review.json
        set +e
        nanoif ai review --repo . --mode all --estimate-only --out dist/ai-review.json --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/ai-estimate.txt"
        code=$?
        set -e
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        cat "$RUNNER_TEMP/ai-estimate.txt"
        cat "$RUNNER_TEMP/ai-estimate.txt" >> "$GITHUB_STEP_SUMMARY"
        echo "nanoif ai review --mode all --estimate-only exited $code" >> "$GITHUB_STEP_SUMMARY"

    - name: Mark the AI comments as running
      if: inputs.runner == 'exe' && inputs.pr != '' && (inputs.mode != 'all' || steps.estimate.outputs.exit_code == '0')
      shell: bash
      env:
        PR: ${{ inputs.pr }}
        ESTIMATE_USD: ${{ steps.estimate.outputs.estimate_usd }}
        ESTIMATE_CALLS: ${{ steps.estimate.outputs.estimate_calls }}
        ESTIMATE_PRICED: ${{ steps.estimate.outputs.estimate_priced }}
      run: |
        args=(--pr "$PR")
        if [ -n "$ESTIMATE_USD" ]; then
          args+=(--estimate-usd "$ESTIMATE_USD" --estimate-calls "$ESTIMATE_CALLS" --estimate-priced "$ESTIMATE_PRICED")
        fi
        nanoif github pending "${args[@]}"

    - name: Run the editors
      id: review
      if: inputs.runner == 'exe'
      shell: bash
      env:
        NANOIF_LLM_PROFILE: ${{ inputs.llm-profile }}
        NANOIF_LLM_MODEL: ${{ inputs.llm-model }}
        NANOIF_RUNNER: exe
        MODE: ${{ inputs.mode }}
        PASSAGE: ${{ inputs.passage }}
        HEAD_SHA: ${{ inputs.head-sha }}
        ESTIMATE_CODE: ${{ steps.estimate.outputs.exit_code }}
      run: |
        args=(--repo . --mode "$MODE" --out dist/ai-review.json)
        if [ "$MODE" = passage ]; then args+=(--passage "$PASSAGE"); fi
        rm -f dist/ai-review-head-sha.txt
        # The pull-request head this review is for, uploaded with it so a later
        # /check-continuity passage=<name> merges only into a review of the same commit.
        if [ -n "$HEAD_SHA" ]; then printf '%s\n' "$HEAD_SHA" > dist/ai-review-head-sha.txt; fi
        # Capture the exit code instead of failing here: the result (or its absence) is
        # published first, and the last step fails the job on a non-zero code.
        if [ "$MODE" = all ] && [ "$ESTIMATE_CODE" != 0 ]; then
          # The estimate step refused (its ai-review.json says why) or failed: no review.
          code="${ESTIMATE_CODE:-1}"
          echo "The review of every passage did not start: the estimate step exited $code." >> "$GITHUB_STEP_SUMMARY"
        else
          rm -f dist/ai-review.json
          set +e
          nanoif ai review "${args[@]}" > "$RUNNER_TEMP/ai-review.txt"
          code=$?
          set -e
          # Per-editor lines and the monthly AI spend line (ADR-023), in the log and the summary.
          cat "$RUNNER_TEMP/ai-review.txt"
          cat "$RUNNER_TEMP/ai-review.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "nanoif ai review --mode $MODE exited $code" >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"

    - name: Merge the re-check into the last AI review
      # A single-passage re-check replaces only that passage's result, so one clean
      # passage cannot hide findings on the others (AC-continuity-review-7). Without an
      # earlier review of the same commit it is published alone, labelled partial.
      if: >-
        !cancelled() && inputs.runner == 'exe' && inputs.mode == 'passage' &&
        steps.review.outcome == 'success' && hashFiles('dist/ai-review.json') != ''
      shell: bash
      env:
        PASSAGE: ${{ inputs.passage }}
        HEAD_SHA: ${{ inputs.head-sha }}
        PREVIOUS_RUN: ${{ inputs.previous-run-id }}
        PREVIOUS_OUTCOME: ${{ steps.previous.outcome }}
      run: |
        args=(--review dist/ai-review.json --passage "$PASSAGE" --out dist/ai-review.json)
        if [ -n "$HEAD_SHA" ]; then args+=(--head-sha "$HEAD_SHA"); fi
        if [ "$PREVIOUS_OUTCOME" = success ]; then
          args+=(--previous-dir "$RUNNER_TEMP/previous-review")
        elif [ -n "$PREVIOUS_RUN" ]; then
          echo "::warning::Could not download the last AI review from run $PREVIOUS_RUN; the re-check of '$PASSAGE' is published as partial"
          echo "The last AI review (run $PREVIOUS_RUN) could not be downloaded; the comments say only '$PASSAGE' was re-checked." >> "$GITHUB_STEP_SUMMARY"
        fi
        nanoif github merge-review "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Publish the review
      if: ${{ !cancelled() && inputs.runner == 'exe' && steps.review.outcome == 'success' }}
      shell: bash
      env:
        PR: ${{ inputs.pr }}
        HEAD_SHA: ${{ inputs.head-sha }}
        CODE: ${{ steps.review.outputs.exit_code }}
        ESTIMATE_USD: ${{ steps.estimate.outputs.estimate_usd }}
        ESTIMATE_CALLS: ${{ steps.estimate.outputs.estimate_calls }}
        ESTIMATE_PRICED: ${{ steps.estimate.outputs.estimate_priced }}
      run: |
        target=()
        if [ -n "$PR" ]; then target+=(--pr "$PR"); fi
        if [ -n "$HEAD_SHA" ]; then target+=(--head-sha "$HEAD_SHA"); fi
        # /check-continuity all: the estimate posted before the run, shown beside the
        # actual cost (AC-continuity-review-11). Empty for every other mode and for a
        # refused estimate.
        estimate=()
        if [ -n "$ESTIMATE_USD" ]; then
          estimate+=(--estimate-usd "$ESTIMATE_USD" --estimate-calls "$ESTIMATE_CALLS" --estimate-priced "$ESTIMATE_PRICED")
        fi
        if [ -f dist/ai-review.json ]; then
          # Suppressed findings come from the review itself (it read ai/dismissals.jsonl).
          nanoif github report "${target[@]}" "${estimate[@]}" --review dist/ai-review.json
        else
          nanoif github unavailable "${target[@]}" \
            --reason "nanoif ai review exited $CODE before writing ai-review.json"
        fi

    - name: Upload ai-review.json
      if: ${{ !cancelled() && inputs.runner == 'exe' && hashFiles('dist/ai-review.json') != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          dist/ai-review.json
          dist/ai-review-head-sha.txt
        retention-days: 90

    - name: Fail when the review failed
      if: inputs.runner == 'exe'
      shell: bash
      env:
        CODE: ${{ steps.review.outputs.exit_code }}
      run: |
        if [ "$CODE" != "0" ]; then
          echo "::error::nanoif ai review exited $CODE; the AI comments say what could not be checked"
          exit 1
        fi
