[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoif"
version = "2026.0.0"
description = "Build, check, and AI-review tooling for a collaborative Twee/Harlowe interactive fiction project"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "ISC" }
dependencies = [
  "jinja2~=3.1",
  "openai~=3.19",
  "jsonschema~=4.23",
]

[project.optional-dependencies]
dev = [
  "pytest~=9.0",
  "ruff~=0.15",
]

[project.scripts]
nanoif = "nanoif.cli:main"

[tool.setuptools.packages.find]
include = ["nanoif*"]

[tool.setuptools.package-data]
nanoif = ["templates/**/*", "prompts/**/*", "schemas/**/*", "llm/templates/*", "eval/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "slow: needs network, git history, or an LLM profile",
  "intent(*ids): acceptance criteria (AC-...) or ADRs (ADR-NNN) this test proves",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
