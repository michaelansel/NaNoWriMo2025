name: Probe AI runner
description: >-
  Decide where AI jobs run. Outputs runner=exe when the exe.dev runner's healthz answers
  within 5 seconds, else runner=hosted, which AI jobs turn into an "AI review unavailable"
  comment and a failed check (there is no fallback provider). vars.AI_RUNNER forces either.

inputs:
  health-url:
    description: The runner's healthz URL (vars.EXE_HEALTH_URL). Empty means not configured.
    default: ""
  override:
    description: >-
      vars.AI_RUNNER; "exe" or "hosted" skips the probe. Any other non-empty value fails
      the probe with a message naming it.
    default: ""

outputs:
  runner:
    description: exe or hosted
    value: ${{ steps.probe.outputs.runner }}
  reason:
    description: Why the runner is hosted (empty for exe)
    value: ${{ steps.probe.outputs.reason }}

runs:
  using: composite
  steps:
    - id: probe
      shell: bash
      env:
        HEALTH_URL: ${{ inputs.health-url }}
        OVERRIDE: ${{ inputs.override }}
      run: |
        reason=""
        case "$OVERRIDE" in
          exe)
            runner=exe ;;
          hosted)
            runner=hosted
            reason="AI runner forced to hosted by vars.AI_RUNNER" ;;
          "")
            if [ -z "$HEALTH_URL" ]; then
              runner=hosted
              reason="exe runner not configured (vars.EXE_HEALTH_URL is empty)"
            elif curl -fsS --max-time 5 "$HEALTH_URL"; then
              runner=exe
            else
              runner=hosted
              reason="exe runner offline (healthz did not answer within 5 s)"
            fi ;;
          *)
            # Never a silent skip: the probe fails, and the ai-review-not-run job turns
            # that into "did not run" comments and failed editor checks on this commit.
            reason="vars.AI_RUNNER is '$OVERRIDE', but it must be empty, exe or hosted"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "::error::$reason. Fix it under Settings > Secrets and variables > Actions > Variables; the AI review did not run."
            echo "AI runner: **probe failed** ($reason)" >> "$GITHUB_STEP_SUMMARY"
            exit 1 ;;
        esac
        echo "runner=$runner" >> "$GITHUB_OUTPUT"
        echo "reason=$reason" >> "$GITHUB_OUTPUT"
        echo "AI runner: **$runner**${reason:+ ($reason)}" >> "$GITHUB_STEP_SUMMARY"
