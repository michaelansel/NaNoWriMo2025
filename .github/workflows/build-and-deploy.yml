name: Build and deploy

# Pull requests: test, build + Structure check, probe, AI review (exe runner), or a
# "did not run" notice on the editors when the build or probe failed.
# Main: test, build, (Story Bible extraction, Phase 3), deploy to Pages.
# Nothing here pushes to a pull request branch.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  TWEEGO_VERSION: "2.1.1"
  HARLOWE_VERSION: "3.3.9"
  # Twine 2.10.0 bundles Harlowe 3.3.9; see .github/actions/build-story for why this URL.
  HARLOWE_URL: "https://raw.githubusercontent.com/klembot/twinejs/2.10.0/public/story-formats/harlowe-3.3.9/format.js"
  HARLOWE_SHA256: "803a0d9d4fb8c3c1c99eaf16f37db6feaad72e36fc7e5f6c5a168465419895f3"
  DOTGRAPH_VERSION: "2.2.0"
  # Self-imposed monthly AI spend cap in USD (ADR-023). Empty means the default ($10);
  # "0" stops all paid inference; "off" disables the cap.
  NANOIF_LLM_MONTHLY_USD: ${{ vars.LLM_MONTHLY_USD }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check nanoif tests
      - name: Test
        run: pytest

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # Build & Structure sticky comment (PRs only)
      checks: write # Structure check run (PRs only)
    env:
      # Fork PRs get a read-only token: they report to the step summary only.
      PR_NUMBER: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number || '' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: path categorization and file dates read git log.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Lint twee formatting (report-only)
        # Issues become warning annotations and a step-summary line; nothing edits the
        # writer's files. --exit-zero keeps issues from failing the job, while a linter
        # error (unreadable path, crash) still exits non-zero and fails it (ADR-018).
        run: |
          nanoif lint src/ --format github --exit-zero 2> "$RUNNER_TEMP/lint.txt"
          cat "$RUNNER_TEMP/lint.txt"
          echo "Twee formatting (report-only): $(tail -n 1 "$RUNNER_TEMP/lint.txt")" >> "$GITHUB_STEP_SUMMARY"

      - name: Check story structure
        id: structure
        # --exit-zero: errors are reported by the Structure check run (failure on PRs) and
        # the step summary on main, and must not skip the build below.
        run: |
          mkdir -p dist
          nanoif check structure src/ --format json --exit-zero > dist/structure.json
          if [ -z "$PR_NUMBER" ]; then
            nanoif check structure src/ --format github --exit-zero
          fi

      - name: Build story
        id: build
        uses: ./.github/actions/build-story
        with:
          install-python: "false"
          base-ref: ${{ github.base_ref }}

      - name: Build & Structure report
        # Runs after any earlier failure too: when install, lint or the structure check
        # failed, the comment and a failed Structure check on this commit say the structure
        # check did not run, instead of the previous push's result staying up (AC-build-and-deploy-7).
        if: ${{ !cancelled() }}
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          STRUCTURE_OUTCOME: ${{ steps.structure.outcome }}
        run: |
          if ! command -v nanoif >/dev/null 2>&1; then
            echo "::warning::nanoif is not installed (an earlier step failed); installing it to post the report"
            echo "Build & Structure report: nanoif was not installed; retried the install to post the report." >> "$GITHUB_STEP_SUMMARY"
            python -m pip install -e .
          fi
          args=(--structure dist/structure.json --dist dist
                --build-outcome "$BUILD_OUTCOME" --structure-outcome "$STRUCTURE_OUTCOME")
          if [ -n "$PR_NUMBER" ]; then args+=(--pr "$PR_NUMBER" --head-sha "$HEAD_SHA"); fi
          nanoif github build-report "${args[@]}"

      - name: Upload story preview
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: story-preview
          path: |
            dist/
            lib/artifacts/
          retention-days: 30

  probe:
    name: probe
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      runner: ${{ steps.probe.outputs.runner }}
      reason: ${{ steps.probe.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
          persist-credentials: false
      - id: probe
        uses: ./.github/actions/probe-runner
        with:
          health-url: ${{ vars.EXE_HEALTH_URL }}
          override: ${{ vars.AI_RUNNER }}

  ai-review:
    name: ai-review
    needs: [build, probe]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ needs.probe.outputs.runner == 'exe' && fromJSON('["self-hosted","exe"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write # Continuity and Style sticky comments
      checks: write # Continuity Editor and Style Editor check runs
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ai-review
        with:
          runner: ${{ needs.probe.outputs.runner }}
          unavailable-reason: ${{ needs.probe.outputs.reason }}
          mode: changed
          pr: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          artifact-name: ai-review-pr-${{ github.event.pull_request.number }}
          llm-profile: ${{ vars.LLM_PROFILE || 'exe' }}
          llm-model: ${{ vars.LLM_MODEL }}
          python-version: ${{ env.PYTHON_VERSION }}

  ai-review-not-run:
    # The review never started for this push (the build failed, or the probe failed, for
    # example on an invalid vars.AI_RUNNER), so ai-review was skipped. Replace both editor
    # comments and fail both editor checks on this commit, so an earlier result is never
    # shown as current (AC-continuity-review-28). !cancelled() rather than always(): a
    # newer push cancels this run, and its comments must not be overwritten.
    name: ai-review-not-run
    needs: [build, probe]
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.build.result != 'success' || needs.probe.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # Continuity and Style sticky comments
      checks: write # Continuity Editor and Style Editor check runs
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BUILD_RESULT: ${{ needs.build.result }}
      PROBE_REASON: ${{ needs.probe.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Say the AI review did not run for this push
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            reason="the build failed, so there was nothing to review; the Build & Structure comment says why"
          else
            reason="the AI runner is not set up correctly (${PROBE_REASON:-see the probe job's log}); ask whoever looks after the repository to fix it"
          fi
          nanoif github not-run --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --reason "$reason"
          echo "::error::AI review did not run: $reason"
          exit 1

  bible-extract:
    # PLACEHOLDER until Phase 3. The real job runs `nanoif bible extract --incremental` on
    # [self-hosted, exe] behind the probe, with contents: write, and commits
    # ai/story-bible-cache.json to main (pull --rebase retry once). Off unless
    # vars.BIBLE_EXTRACT == 'true'.
    name: bible-extract
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.BIBLE_EXTRACT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Placeholder
        run: echo "Story Bible extraction lands in Phase 3" | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy
    needs: [build, bible-extract]
    # Deploy even when extraction failed or was skipped: the site renders the previous cache.
    if: ${{ always() && needs.build.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: story-preview
          path: site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v5
