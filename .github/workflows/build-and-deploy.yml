name: Build and deploy

# Pull requests: context, format (ADR-025), test, build + Structure check, probe, AI review
# then the Story Bible preview of the pull request's passages (exe runner), or a "did not
# run" notice on the editors and the Story Bible comment when the build or probe failed.
# When format pushes its one formatting commit to a same-repository pull request branch,
# this run stops before build and the dispatched run (input `pr`) builds the new head;
# every pull request job takes its pull request from `context`, never from the event.
# Main: test, build, probe, Story Bible extraction (exe runner; commits only
# ai/story-bible-cache.json to main), then deploy to Pages with the Bible re-rendered
# from the newest cache.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bible-mode:
        description: "Story Bible extraction on main: incremental (changed passages) or full (every passage, ids kept)"
        type: choice
        options: [incremental, full]
        default: incremental
      pr:
        description: "Rebuild this pull request's head (the format job dispatches it on the head branch after its commit); empty on main"
        type: string
        default: ""

permissions: {}

concurrency:
  # A dispatched rebuild of pull request N joins ci-pr-N and cancels the run that pushed.
  group: >-
    ${{ (github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number))
    || (github.event_name == 'workflow_dispatch' && inputs.pr != '' && format('ci-pr-{0}', inputs.pr))
    || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.pr != '') }}

env:
  PYTHON_VERSION: "3.13"
  TWEEGO_VERSION: "2.1.1"
  HARLOWE_VERSION: "3.3.9"
  # Twine 2.10.0 bundles Harlowe 3.3.9; see .github/actions/build-story for why this URL.
  HARLOWE_URL: "https://raw.githubusercontent.com/klembot/twinejs/2.10.0/public/story-formats/harlowe-3.3.9/format.js"
  HARLOWE_SHA256: "803a0d9d4fb8c3c1c99eaf16f37db6feaad72e36fc7e5f6c5a168465419895f3"
  DOTGRAPH_VERSION: "2.2.0"
  # Self-imposed monthly AI spend cap in USD (ADR-023). Empty means the default ($10);
  # "0" stops all paid inference; "off" disables the cap.
  NANOIF_LLM_MONTHLY_USD: ${{ vars.LLM_MONTHLY_USD }}

jobs:
  context:
    # The pull request every PR job works on (ADR-025): from the event on pull_request, from
    # the API when this run was dispatched with `pr` (the format job's rebuild of its commit).
    # A dispatched run fails here, with the reason, when the pull request is not open, when
    # this run's commit is no longer its head (a stale dispatch), or when GitHub's merge
    # commit is still not for that head after 5 retries 10 s apart; merge_sha is that
    # checked merge commit, which the PR jobs check out. Empty outputs on main.
    name: context
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.context.outputs.pr }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      head_ref: ${{ steps.context.outputs.head_ref }}
      base_ref: ${{ steps.context.outputs.base_ref }}
      base_sha: ${{ steps.context.outputs.base_sha }}
      same_repo: ${{ steps.context.outputs.same_repo }}
      merge_sha: ${{ steps.context.outputs.merge_sha }}
    steps:
      - id: context
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          fail() {
            echo "::error::$1"
            echo "Pull request context: $1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          pr="" head="" head_ref="" head_repo="" base_ref="" base_sha="" merge=""
          if [ "$EVENT" = pull_request ]; then
            pr="$EVENT_PR" head="$EVENT_HEAD_SHA" head_ref="$EVENT_HEAD_REF"
            head_repo="$EVENT_HEAD_REPO" base_ref="$EVENT_BASE_REF" base_sha="$EVENT_BASE_SHA"
            merge="$GITHUB_SHA"
          elif [ -n "$INPUT_PR" ]; then
            case "$INPUT_PR" in
              *[!0-9]*) fail "the pr input '$INPUT_PR' is not a pull request number" ;;
            esac
            pr="$INPUT_PR" pull="$RUNNER_TEMP/pull.json" second=""
            # GitHub updates the merge commit asynchronously after a push.
            for attempt in 1 2 3 4 5 6; do
              gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" > "$pull"
              state=$(jq -r '.state' "$pull")
              head=$(jq -r '.head.sha' "$pull")
              if [ "$state" != open ]; then
                fail "pull request #$pr is $state, so there is nothing to rebuild"
              fi
              if [ "$head" != "$GITHUB_SHA" ]; then
                fail "this run is for ${GITHUB_SHA::7}, but the head of #$pr is now ${head::7} (a stale dispatch); the newer push has its own run"
              fi
              merge=$(jq -r '.merge_commit_sha // ""' "$pull")
              if [ -n "$merge" ]; then
                second=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$merge" --jq '.parents[1].sha // ""')
                if [ "$second" = "$head" ]; then break; fi
              fi
              if [ "$attempt" != 6 ]; then
                echo "The merge commit of #$pr is not for ${head::7} yet; retrying in 10 s"
                sleep 10
              fi
            done
            if [ "$second" != "$head" ]; then
              if [ "$(jq -r '.mergeable' "$pull")" = false ]; then
                fail "pull request #$pr has conflicts with its base branch, so GitHub has no merge commit to build; resolve them and push"
              fi
              fail "after 50 s the merge commit of #$pr is still not for ${head::7} (its second parent is ${second:-missing}); re-run this workflow or push again"
            fi
            head_ref=$(jq -r '.head.ref' "$pull")
            head_repo=$(jq -r '.head.repo.full_name // ""' "$pull")
            base_ref=$(jq -r '.base.ref' "$pull")
            base_sha=$(jq -r '.base.sha' "$pull")
          fi
          same_repo=false
          if [ -n "$pr" ] && [ "$head_repo" = "$GITHUB_REPOSITORY" ]; then same_repo=true; fi
          {
            echo "pr=$pr"
            echo "head_sha=$head"
            echo "head_ref=$head_ref"
            echo "base_ref=$base_ref"
            echo "base_sha=$base_sha"
            echo "same_repo=$same_repo"
            echo "merge_sha=$merge"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$pr" ]; then
            echo "Pull request #$pr, head ${head::7}, merge commit ${merge::7} ($EVENT)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No pull request ($EVENT on $GITHUB_REF)." >> "$GITHUB_STEP_SUMMARY"
          fi

  format:
    # The one job that pushes to a pull request branch (ADR-025): whitespace and quote marks in
    # the prose files this pull request adds, modifies or renames, as one commit by
    # github-actions[bot]. Same-repository pull_request runs only; never on main, forks or
    # dispatched runs. Tooling comes from the base branch and runs with no token; the head is
    # a separate checkout that is only data to it. A push starts no run, so after pushing it
    # starts intent.yml and this workflow (input pr) for the new head. Anything that stops the
    # fix from reaching the branch, or its checks from starting, fails this job and is said in
    # the Build comment: by build (not fixed, not pushed) or here (checks did not start).
    name: format
    needs: context
    if: github.event_name == 'pull_request' && needs.context.outputs.same_repo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the formatting commit to the head branch
      actions: write # start intent.yml and this workflow for the new head
      pull-requests: write # the Build comment when those could not start
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
      new_sha: ${{ steps.push.outputs.new_sha }}
      problem: ${{ steps.result.outputs.problem }}
      reason: ${{ steps.result.outputs.reason }}
    env:
      PR_NUMBER: ${{ needs.context.outputs.pr }}
      HEAD_SHA: ${{ needs.context.outputs.head_sha }}
      HEAD_REF: ${{ needs.context.outputs.head_ref }}
      BASE_SHA: ${{ needs.context.outputs.base_sha }}
    steps:
      - name: Formatting tooling (base branch)
        id: tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.context.outputs.base_ref }}
          path: .format-tooling
          persist-credentials: false

      - uses: actions/setup-python@v7
        # No pip cache: a pull request's own jobs can write to it, and this job can push.
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the tooling
        id: install
        # Not editable, and `nanoif` is run as the installed script: nothing is imported from
        # the pull request's checkout below.
        run: python -m pip install ./.format-tooling

      - name: Pull request head
        id: head
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.context.outputs.head_sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false

      - name: Choose the files to fix
        id: files
        working-directory: head
        run: |
          # Loop guard: the bot's own formatting commit is never formatted again.
          author=$(git log -1 --format=%an HEAD)
          trailer=$(git log -1 --format=%B HEAD | sed -n -E 's/^Nanoif-Format: ([0-9a-f]{40})$/\1/p')
          if [ "$author" = "github-actions[bot]" ] && [ -n "$trailer" ]; then
            echo "Formatting: the head is the bot's formatting commit; nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo "files=" >> "$GITHUB_OUTPUT"
          elif ! yq -e '.on.workflow_dispatch.inputs.pr' .github/workflows/build-and-deploy.yml > /dev/null 2>&1; then
            # The rebuild runs this branch's copy of the workflow; without the pr input a
            # pushed fix would get no checks, so nothing is fixed.
            echo "outdated=true" >> "$GITHUB_OUTPUT"
            echo "files=" >> "$GITHUB_OUTPUT"
          else
            base=$(git merge-base "$BASE_SHA" HEAD)
            git diff --name-only --diff-filter=AMR "$base" HEAD -- src/ > "$RUNNER_TEMP/changed.txt"
            # Writers' prose files only; infrastructure files stay report-only.
            sed -n -E '/^src\/[A-Za-z]{1,10}-[0-9]{8}\.twee$/p' "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/prose.txt"
            files=$(tr '\n' ' ' < "$RUNNER_TEMP/prose.txt")
            echo "files=$files" >> "$GITHUB_OUTPUT"
            echo "Formatting: prose files changed by this pull request: ${files:-none}." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fix formatting
        id: fix
        if: steps.files.outputs.files != ''
        working-directory: head
        env:
          FILES: ${{ steps.files.outputs.files }}
        # Exit 0 written or nothing to fix, 1 nothing written (a refused fix: the reason is
        # the last stderr line), 2 usage. The code is captured for the result step.
        run: |
          set +e
          # shellcheck disable=SC2086 # FILES holds src/<INITIALS>-<YYYYMMDD>.twee names only
          nanoif lint --fix $FILES --summary-out "$RUNNER_TEMP/lint-fix.json" > "$RUNNER_TEMP/fix.txt" 2> "$RUNNER_TEMP/fix-err.txt"
          code=$?
          set -e
          cat "$RUNNER_TEMP/fix.txt" "$RUNNER_TEMP/fix-err.txt"
          cat "$RUNNER_TEMP/fix.txt" "$RUNNER_TEMP/fix-err.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Commit the fix
        id: commit
        if: steps.fix.outputs.exit_code == '0'
        working-directory: head
        env:
          FILES: ${{ steps.files.outputs.files }}
        run: |
          if git diff --quiet; then
            echo "Formatting: nothing to fix." >> "$GITHUB_STEP_SUMMARY"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            unexpected=$(git status --porcelain --untracked-files=all | sed -n -E '/^ M src\/[A-Za-z]{1,10}-[0-9]{8}\.twee$/!p')
            if [ -n "$unexpected" ]; then
              echo "::error::The fixer changed more than the named prose files: $unexpected"
              exit 1
            fi
            nanoif github format-message --summary "$RUNNER_TEMP/lint-fix.json" --previous-sha "$HEAD_SHA" --out "$RUNNER_TEMP/format-message.txt"
            # shellcheck disable=SC2086
            git add -- $FILES
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet --file "$RUNNER_TEMP/format-message.txt"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the fix
        id: push
        if: steps.commit.outputs.committed == 'true'
        working-directory: head
        env:
          TOKEN: ${{ github.token }}
        # Never forced. A rejection means the writer pushed again: no retry, the newer run
        # formats it.
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          set +e
          git -c "http.$GITHUB_SERVER_URL/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:refs/heads/$HEAD_REF" 2> "$RUNNER_TEMP/push-err.txt"
          code=$?
          set -e
          cat "$RUNNER_TEMP/push-err.txt"
          if [ "$code" = 0 ]; then
            new_sha=$(git rev-parse HEAD)
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "new_sha=$new_sha" >> "$GITHUB_OUTPUT"
            echo "Formatting: pushed \"$(git log -1 --format=%s)\" as ${new_sha::7}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            if grep -q -E '\[rejected\]|non-fast-forward|fetch first' "$RUNNER_TEMP/push-err.txt"; then
              echo "Formatting: branch moved; the newer run formats it." >> "$GITHUB_STEP_SUMMARY"
              reason="the branch moved while the bot was fixing it; the run for the newer push formats it"
            else
              reason="the bot's fix could not be pushed ($(tail -n 1 "$RUNNER_TEMP/push-err.txt"))"
            fi
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
          fi

      - name: Start the checks for the fixed commit
        id: dispatch
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # intent.yml first: the build-and-deploy run joins ci-pr-<N> and cancels this run.
        run: |
          start() {
            local attempt
            for attempt in 1 2; do
              if gh workflow run "$1" --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF" "${@:2}" 2>> "$RUNNER_TEMP/dispatch-err.txt"; then
                echo "Formatting: started $1 for the fixed commit." >> "$GITHUB_STEP_SUMMARY"
                return 0
              fi
              if [ "$attempt" = 1 ]; then sleep 10; fi
            done
            return 1
          }
          reason=""
          if ! start intent.yml; then
            reason="intent.yml could not be started ($(tail -n 1 "$RUNNER_TEMP/dispatch-err.txt"))"
          elif ! start build-and-deploy.yml -f "pr=$PR_NUMBER"; then
            reason="build-and-deploy.yml could not be started ($(tail -n 1 "$RUNNER_TEMP/dispatch-err.txt"))"
          fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Say the checks for the fixed commit could not start
        id: not-started
        if: steps.dispatch.outputs.reason != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEW_SHA: ${{ steps.push.outputs.new_sha }}
          REASON: ${{ steps.dispatch.outputs.reason }}
        run: |
          nanoif github build-report --pr "$PR_NUMBER" --head-sha "$NEW_SHA" --format-commit "$RUNNER_TEMP/format-message.txt" --format-problem dispatch-failed --format-reason "$REASON"

      - name: Formatting result
        id: result
        # The outputs build reads for the Build comment; any problem fails this job.
        if: ${{ !cancelled() }}
        env:
          TOOLING: ${{ steps.tooling.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          HEAD: ${{ steps.head.outcome }}
          FILES: ${{ steps.files.outcome }}
          OUTDATED: ${{ steps.files.outputs.outdated }}
          FIX: ${{ steps.fix.outcome }}
          FIX_CODE: ${{ steps.fix.outputs.exit_code }}
          COMMIT: ${{ steps.commit.outcome }}
          PUSH: ${{ steps.push.outcome }}
          PUSH_REASON: ${{ steps.push.outputs.reason }}
          DISPATCH: ${{ steps.dispatch.outcome }}
          DISPATCH_REASON: ${{ steps.dispatch.outputs.reason }}
        run: |
          problem="" reason=""
          if [ "$TOOLING" != success ] || [ "$INSTALL" != success ] || [ "$HEAD" != success ] || [ "$FILES" != success ]; then
            problem=refused
            reason="the formatting job could not check out or install what it needs; the format job's log says why"
          elif [ "$OUTDATED" = true ]; then
            problem=refused
            reason="this branch's copy of build-and-deploy.yml is older than the formatting bot, so a fixed commit could not be rebuilt; update the branch from main to get formatting fixed"
          elif [ "$FIX" = failure ] || { [ -n "$FIX_CODE" ] && [ "$FIX_CODE" != 0 ]; }; then
            problem=refused
            if [ -s "$RUNNER_TEMP/fix-err.txt" ]; then
              reason=$(tail -n 1 "$RUNNER_TEMP/fix-err.txt")
              reason="${reason#error: }"
              reason="${reason%; nothing was written}"
            fi
            if [ -z "$reason" ]; then
              reason="the fixer stopped without a reason; the log of the format job says why"
            fi
          elif [ "$COMMIT" = failure ]; then
            problem=refused
            reason="the fix could not be committed; the format job's log says why"
          elif [ "$PUSH" = failure ] || [ -n "$PUSH_REASON" ]; then
            problem=push-failed
            reason="$PUSH_REASON"
            if [ -z "$reason" ]; then
              reason="the fix could not be pushed; the log of the format job says why"
            fi
          elif [ "$DISPATCH" = failure ] || [ -n "$DISPATCH_REASON" ]; then
            problem=dispatch-failed
            reason="${DISPATCH_REASON:-the checks for the fixed commit could not be started}"
          fi
          echo "problem=$problem" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          if [ -n "$problem" ]; then
            echo "::error::Formatting was not applied or not checked ($problem): $reason"
            echo "Formatting was not applied or not checked ($problem): $reason" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check nanoif tests
      - name: Test
        run: pytest

  build:
    # Not in the run whose format job pushed: the dispatched run builds the new head
    # (ADR-025). !cancelled() because format is skipped on main and on forks.
    name: build
    needs: [context, format]
    if: ${{ !cancelled() && needs.format.outputs.pushed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # Build & Structure sticky comment (PRs only)
      checks: write # Structure check run (PRs only)
    env:
      # Fork PRs get a read-only token: they report to the step summary only.
      PR_NUMBER: ${{ needs.context.outputs.same_repo == 'true' && needs.context.outputs.pr || '' }}
      HEAD_SHA: ${{ needs.context.outputs.head_sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Stop when there is no pull request context
        # A failed context (a stale or unbuildable dispatch) is a failed build, never a
        # skipped one: the context job's log says why.
        if: needs.context.result != 'success'
        run: |
          echo "::error::The context job did not succeed, so there is nothing to build; its log says why"
          exit 1

      - uses: actions/checkout@v7
        with:
          # The merge commit context checked (empty on main: this run's commit).
          ref: ${{ needs.context.outputs.merge_sha }}
          # Full history: path categorization and file dates read git log.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Lint twee formatting (report-only)
        # Issues become warning annotations and a step-summary line; this step edits nothing
        # (the format job fixes prose files, ADR-025). --exit-zero keeps issues from failing
        # the job, while a linter error (unreadable path, crash) still exits non-zero and
        # fails it (ADR-018).
        run: |
          nanoif lint src/ --format github --exit-zero 2> "$RUNNER_TEMP/lint.txt"
          cat "$RUNNER_TEMP/lint.txt"
          echo "Twee formatting (report-only): $(tail -n 1 "$RUNNER_TEMP/lint.txt")" >> "$GITHUB_STEP_SUMMARY"

      - name: Check story structure
        id: structure
        # --exit-zero: errors are reported by the Structure check run (failure on PRs) and
        # the step summary on main, and must not skip the build below.
        run: |
          mkdir -p dist
          nanoif check structure src/ --format json --exit-zero > dist/structure.json
          if [ -z "$PR_NUMBER" ]; then
            nanoif check structure src/ --format github --exit-zero
          fi

      - name: Build story
        id: build
        uses: ./.github/actions/build-story
        with:
          install-python: "false"
          base-ref: ${{ needs.context.outputs.base_ref }}

      - name: Build & Structure report
        # Runs after any earlier failure too: when install, lint or the structure check
        # failed, the comment and a failed Structure check on this commit say the structure
        # check did not run, instead of the previous push's result staying up (AC-build-and-deploy-7).
        # It also says what the format job did (ADR-025): the bot's fix when this head is its
        # commit, or why this push's formatting was not fixed or not pushed.
        if: ${{ !cancelled() && needs.context.result == 'success' }}
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          STRUCTURE_OUTCOME: ${{ steps.structure.outcome }}
          FORMAT_PROBLEM: ${{ needs.format.outputs.problem }}
          FORMAT_REASON: ${{ needs.format.outputs.reason }}
        run: |
          if ! command -v nanoif >/dev/null 2>&1; then
            echo "::warning::nanoif is not installed (an earlier step failed); installing it to post the report"
            echo "Build & Structure report: nanoif was not installed; retried the install to post the report." >> "$GITHUB_STEP_SUMMARY"
            python -m pip install -e .
          fi
          args=(--structure dist/structure.json --dist dist
                --build-outcome "$BUILD_OUTCOME" --structure-outcome "$STRUCTURE_OUTCOME")
          if [ -n "$PR_NUMBER" ]; then
            args+=(--pr "$PR_NUMBER" --head-sha "$HEAD_SHA")
            if git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null &&
               [ "$(git log -1 --format=%an "$HEAD_SHA")" = "github-actions[bot]" ]; then
              git log -1 --format=%B "$HEAD_SHA" > "$RUNNER_TEMP/head-commit.txt"
              args+=(--format-commit "$RUNNER_TEMP/head-commit.txt")
            fi
          fi
          if [ -n "$FORMAT_PROBLEM" ]; then
            args+=(--format-problem "$FORMAT_PROBLEM" --format-reason "$FORMAT_REASON")
          fi
          nanoif github build-report "${args[@]}"

      - name: Upload story preview
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: story-preview
          path: |
            dist/
            lib/artifacts/
          retention-days: 30

  probe:
    # Pull requests (AI review), pushes to main and dispatches (Story Bible extraction).
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      runner: ${{ steps.probe.outputs.runner }}
      reason: ${{ steps.probe.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
          persist-credentials: false
      - id: probe
        uses: ./.github/actions/probe-runner
        with:
          health-url: ${{ vars.EXE_HEALTH_URL }}
          override: ${{ vars.AI_RUNNER }}

  ai-review:
    # Same-repository pull requests only, from the event or a dispatched rebuild (context).
    # !cancelled() and explicit results: build ran after a skipped or failed format job.
    name: ai-review
    needs: [context, build, probe]
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.probe.result == 'success' &&
      needs.context.outputs.pr != '' && needs.context.outputs.same_repo == 'true'
    runs-on: ${{ needs.probe.outputs.runner == 'exe' && fromJSON('["self-hosted","exe"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write # Continuity, Style and Story Bible sticky comments
      checks: write # Continuity Editor, Style Editor and Story Bible preview check runs
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.context.outputs.pr }}
      HEAD_SHA: ${{ needs.context.outputs.head_sha }}
      RUNNER_KIND: ${{ needs.probe.outputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit context checked (a dispatched run's second parent is its head).
          ref: ${{ needs.context.outputs.merge_sha }}
          persist-credentials: false
      - uses: ./.github/actions/ai-review
        with:
          runner: ${{ needs.probe.outputs.runner }}
          unavailable-reason: ${{ needs.probe.outputs.reason }}
          mode: changed
          pr: ${{ needs.context.outputs.pr }}
          head-sha: ${{ needs.context.outputs.head_sha }}
          artifact-name: ai-review-pr-${{ needs.context.outputs.pr }}
          llm-profile: ${{ vars.LLM_PROFILE || 'exe' }}
          llm-model: ${{ vars.LLM_MODEL }}
          python-version: ${{ env.PYTHON_VERSION }}

      # Story Bible preview (ADR-026): after the review has published, so the review has the
      # first claim on the runner and on the monthly budget. Its result is the
      # <!-- nano:bible --> comment and the "Story Bible preview" check run on this head;
      # a preview failure is never a review failure. Tooling comes from the default branch,
      # in its own venv; src/, story-overrides.txt and ai/story-bible-cache.json are the
      # merge commit's, checked out above. It commits nothing and never builds canon-pack.json.
      # In a dispatched run the context job already waited (5 x 10 s) for the merge commit
      # whose second parent is this head; the check below re-reads the checked-out commit.
      - name: Story Bible preview tooling (default branch)
        id: bible-tooling
        if: ${{ !cancelled() && env.RUNNER_KIND == 'exe' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.context.outputs.base_ref }}
          path: .bible-tooling
          persist-credentials: false

      - name: Install the Story Bible preview tooling
        id: bible-install
        if: ${{ !cancelled() && steps.bible-tooling.outcome == 'success' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/bible-venv"
          "$RUNNER_TEMP/bible-venv/bin/python" -m pip install -e ./.bible-tooling

      - name: Check that the merge commit is this push's
        id: bible-merge
        if: ${{ !cancelled() && steps.bible-install.outcome == 'success' }}
        run: |
          # The checkout is shallow, but the commit object still names both parents.
          second=$(git cat-file -p HEAD | awk '/^parent / { n++; if (n == 2) print $2 }')
          if [ "$second" != "$HEAD_SHA" ]; then
            echo "::error::The merge commit's second parent is ${second:-missing}, not this push's head $HEAD_SHA; the Story Bible preview reads nothing"
            exit 1
          fi

      - name: Extract this pull request's passages for the preview
        id: bible-extract
        if: ${{ !cancelled() && steps.bible-merge.outcome == 'success' }}
        timeout-minutes: 10
        env:
          NANOIF_LLM_PROFILE: ${{ vars.LLM_PROFILE || 'exe' }}
          NANOIF_LLM_MODEL: ${{ vars.LLM_MODEL }}
        # Exit 0 ok, 3 partial, 1 nothing written (spend cap, invalid cache, error). The code
        # is captured so the page and the comment say what happened; a missing code means
        # the step stopped (the 10-minute limit) before it could say.
        run: |
          export PATH="$RUNNER_TEMP/bible-venv/bin:$PATH"
          out="$RUNNER_TEMP/bible-preview"
          mkdir -p "$out/site"
          set +e
          nanoif bible extract --repo . --preview --cache-out "$out/story-bible-cache.json" --diff-out "$out/site/bible-diff.json" > "$out/extract.txt" 2> "$out/extract-err.txt"
          code=$?
          set -e
          cat "$out/extract.txt" "$out/extract-err.txt"
          cat "$out/extract.txt" "$out/extract-err.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "nanoif bible extract --preview exited $code" >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Say why the Story Bible preview did not run, if it did not
        id: bible-why
        if: ${{ !cancelled() && env.RUNNER_KIND == 'exe' }}
        env:
          INSTALL: ${{ steps.bible-install.outcome }}
          MERGE: ${{ steps.bible-merge.outcome }}
          CODE: ${{ steps.bible-extract.outputs.exit_code }}
        run: |
          reason=""
          if [ "$INSTALL" != success ]; then
            reason="the default branch's Story Bible tooling could not be installed; the job log says why"
          elif [ "$MERGE" != success ]; then
            reason="the merge commit this job checked out is not this push's; push again to retry"
          elif [ -z "$CODE" ]; then
            reason="the extraction stopped before it finished (the 10-minute limit, or an error in the job log)"
          elif [ "$CODE" != 0 ] && [ "$CODE" != 3 ]; then
            # The CLI's last stderr line; for the spend cap it carries the reset date (ADR-023).
            reason="$(tail -n 1 "$RUNNER_TEMP/bible-preview/extract-err.txt")"
            reason="${reason#bible extract did not run: }"
            reason="${reason#bible extract failed: }"
            reason="${reason%; nothing was written}"
            reason="${reason:-the extraction exited $CODE and gave no reason}"
          fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          if [ -n "$reason" ]; then
            echo "::warning::Story Bible preview did not run: $reason"
            echo "Story Bible preview did not run: $reason" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the preview Story Bible
        id: bible-page
        # From the would-be cache when the extraction ran, else from main's cache with the
        # reason in Freshness (AC-story-bible-35). No canon pack: the review keeps main's.
        if: ${{ !cancelled() && steps.bible-merge.outcome == 'success' && steps.bible-why.outcome == 'success' }}
        env:
          REASON: ${{ steps.bible-why.outputs.reason }}
        run: |
          export PATH="$RUNNER_TEMP/bible-venv/bin:$PATH"
          out="$RUNNER_TEMP/bible-preview"
          if [ -z "$REASON" ]; then
            nanoif build story-bible --repo . --out "$out/site" --cache "$out/story-bible-cache.json" --preview-passages dist/changes.json --preview-diff "$out/site/bible-diff.json"
          else
            nanoif build story-bible --repo . --out "$out/site" --preview-passages dist/changes.json --preview-reason "$REASON"
          fi

      - name: Upload the preview Story Bible
        id: bible-upload
        # Its own artifact: story-preview is never overwritten, so the Build comment's link
        # keeps working while someone downloads it.
        if: ${{ !cancelled() && steps.bible-page.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: story-bible-preview
          path: ${{ runner.temp }}/bible-preview/site/
          retention-days: 30

      - name: Report the Story Bible preview
        if: ${{ !cancelled() && env.RUNNER_KIND == 'exe' }}
        env:
          REASON: ${{ steps.bible-why.outputs.reason }}
          UPLOAD: ${{ steps.bible-upload.outcome }}
        run: |
          # Published with the tooling that published the review, like the editor comments;
          # the default branch's venv only when that one is missing.
          export PATH="$PATH:$RUNNER_TEMP/bible-venv/bin"
          if [ -z "$REASON" ] && [ "$UPLOAD" != success ]; then
            REASON="the preview Story Bible page could not be built or uploaded; the job log says why"
          fi
          if [ -z "$REASON" ]; then
            nanoif github bible-report --preview --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --diff "$RUNNER_TEMP/bible-preview/site/bible-diff.json"
          else
            nanoif github bible-report --preview --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --reason "$REASON"
          fi

      - name: Say the Story Bible preview did not run (hosted runner)
        # No extraction without the exe runner: the comment and a failed check say why, and
        # the Build comment's preview shows main's Bible with these passages as not read.
        if: ${{ !cancelled() && env.RUNNER_KIND != 'exe' }}
        env:
          PROBE_REASON: ${{ needs.probe.outputs.reason }}
        run: |
          nanoif github bible-report --preview --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --reason "${PROBE_REASON:-the exe runner is not available}"

  ai-review-not-run:
    # The review never started for this push (the build failed, or the probe failed, for
    # example on an invalid vars.AI_RUNNER), so ai-review was skipped. Replace both editor
    # comments and the Story Bible comment, and fail their checks on this commit, so an
    # earlier result is never shown as current (AC-continuity-review-28, ADR-026). !cancelled() rather than always(): a
    # newer push cancels this run, and its comments must not be overwritten. Not when format
    # pushed: this run's commit is no longer the head, and the dispatched run reviews the new
    # one (ADR-025).
    name: ai-review-not-run
    needs: [context, format, build, probe]
    if: >-
      !cancelled() && needs.context.result == 'success' &&
      needs.context.outputs.pr != '' && needs.context.outputs.same_repo == 'true' &&
      needs.format.outputs.pushed != 'true' &&
      (needs.build.result != 'success' || needs.probe.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # Continuity, Style and Story Bible sticky comments
      checks: write # Continuity Editor, Style Editor and Story Bible preview check runs
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.context.outputs.pr }}
      HEAD_SHA: ${{ needs.context.outputs.head_sha }}
      BUILD_RESULT: ${{ needs.build.result }}
      PROBE_REASON: ${{ needs.probe.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.context.outputs.merge_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Say the AI review did not run for this push
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            reason="the build failed, so there was nothing to review; the Build & Structure comment says why"
          else
            reason="the AI runner is not set up correctly (${PROBE_REASON:-see the probe job's log}); ask whoever looks after the repository to fix it"
          fi
          nanoif github not-run --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --reason "$reason"
          # The Story Bible preview did not run either: replace the previous push's (ADR-026).
          nanoif github bible-report --preview --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --reason "$reason"
          echo "::error::AI review did not run: $reason"
          exit 1

  bible-extract:
    # Story Bible extraction after a push or dispatch on main (ADR-020); never on a pull
    # request. It runs inside the workflow's `pages` concurrency group, so two runs on main
    # never extract at once, and it is the only job here that may write to main: it commits
    # ai/story-bible-cache.json alone. The deploy job re-renders the Bible from its result.
    # Explicit results with !cancelled(): build runs after a skipped format job, and a plain
    # needs would skip this job with it. Never for a dispatched pull request rebuild.
    name: bible-extract
    needs: [build, probe]
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.probe.result == 'success' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.pr
    runs-on: ${{ needs.probe.outputs.runner == 'exe' && fromJSON('["self-hosted","exe"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: write # commit ai/story-bible-cache.json to main
    env:
      NANOIF_LLM_PROFILE: ${{ vars.LLM_PROFILE || 'exe' }}
      NANOIF_LLM_MODEL: ${{ vars.LLM_MODEL }}
      BIBLE_MODE: ${{ inputs.bible-mode || 'incremental' }}
    steps:
      - name: Report that extraction cannot run here
        # There is no fallback provider: on a hosted runner nothing is extracted, the job
        # fails, and the deploy still publishes the last saved Bible, which says so.
        if: needs.probe.outputs.runner != 'exe'
        env:
          REASON: ${{ needs.probe.outputs.reason }}
        run: |
          reason="${REASON:-the exe runner is not available}"
          echo "::error::Story Bible extraction did not run: $reason. The site deploys with the last saved Bible."
          echo "Story Bible extraction did not run: $reason; the site deploys with the last saved Bible." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/checkout@v7
        if: needs.probe.outputs.runner == 'exe'
        with:
          # The newest main, so the extraction starts from any cache committed since this
          # run's commit (a push starts no workflow when made with GITHUB_TOKEN).
          ref: main

      - name: Python venv (exe runner)
        if: needs.probe.outputs.runner == 'exe'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install nanoif
        if: needs.probe.outputs.runner == 'exe'
        run: python -m pip install -e .

      - name: Extract the Story Bible
        id: extract
        if: needs.probe.outputs.runner == 'exe'
        # Exit 0 ok, 3 partial (what was read is saved), 1 nothing written (invalid cache,
        # spend cap, error). The code is captured so the cache is committed before a
        # partial run fails the job.
        run: |
          set +e
          if [ "$BIBLE_MODE" = full ]; then
            nanoif bible extract --repo . --full > "$RUNNER_TEMP/bible.txt" 2> "$RUNNER_TEMP/bible-err.txt"
          else
            nanoif bible extract --repo . --incremental > "$RUNNER_TEMP/bible.txt" 2> "$RUNNER_TEMP/bible-err.txt"
          fi
          code=$?
          set -e
          cat "$RUNNER_TEMP/bible.txt" "$RUNNER_TEMP/bible-err.txt"
          cat "$RUNNER_TEMP/bible.txt" "$RUNNER_TEMP/bible-err.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "nanoif bible extract --$BIBLE_MODE exited $code" >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != 0 ] && [ "$code" != 3 ]; then
            echo "::error::Story Bible extraction failed and saved nothing; the site deploys with the last saved Bible."
            exit "$code"
          fi

      - name: Commit the cache to main
        if: steps.extract.outputs.exit_code == '0' || steps.extract.outputs.exit_code == '3'
        run: |
          if [ ! -f ai/story-bible-cache.json ]; then
            echo "No Story Bible cache was written; nothing to commit." >> "$GITHUB_STEP_SUMMARY"
          elif git diff --quiet HEAD -- ai/story-bible-cache.json && git ls-files --error-unmatch ai/story-bible-cache.json > /dev/null 2>&1; then
            echo "Story Bible cache unchanged; nothing to commit." >> "$GITHUB_STEP_SUMMARY"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ai/story-bible-cache.json
            git commit -m "chore: update story bible cache"
            if ! git push origin HEAD:main; then
              echo "Push rejected; rebasing once onto the new main"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
            echo "Committed ai/story-bible-cache.json to main." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the cache for the deploy
        if: steps.extract.outputs.exit_code == '0' || steps.extract.outputs.exit_code == '3'
        uses: actions/upload-artifact@v7
        with:
          name: bible-cache
          path: ai/story-bible-cache.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail a partial extraction
        if: steps.extract.outputs.exit_code == '3'
        run: |
          echo "::error::Story Bible extraction was partial: the passages or entities listed above were not read or reconciled. What was read is saved; the next extraction retries the rest."
          exit 1

  deploy:
    # Runs when the build succeeded, whatever the extraction did (AC-story-bible-18): the
    # Story Bible and the canon pack are re-rendered from the newest cache (the bible-cache
    # artifact when extraction saved one, else the cache at this commit) and the page says
    # when the latest extraction did not complete.
    name: deploy
    needs: [build, bible-extract]
    if: ${{ always() && needs.build.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      EXTRACTION_RESULT: ${{ needs.bible-extract.result }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: story-preview
          path: site
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: repo
          persist-credentials: false
      - name: Download the extracted cache, if any
        # A pattern that matches nothing downloads nothing; the next step says which cache
        # the page is built from.
        uses: actions/download-artifact@v8
        with:
          pattern: bible-cache
          merge-multiple: true
          path: ${{ runner.temp }}/bible-cache
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: repo/pyproject.toml
      - name: Install nanoif
        run: python -m pip install -e repo
      - name: Re-render the Story Bible and the canon pack
        run: |
          if [ -f "$RUNNER_TEMP/bible-cache/story-bible-cache.json" ]; then
            mkdir -p repo/ai
            cp "$RUNNER_TEMP/bible-cache/story-bible-cache.json" repo/ai/story-bible-cache.json
            echo "Story Bible: rendered from the cache this run's extraction saved." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Story Bible: rendered from the cache at ${GITHUB_SHA::8} (latest extraction: $EXTRACTION_RESULT)." >> "$GITHUB_STEP_SUMMARY"
          fi
          nanoif build story-bible --repo repo --artifacts site/lib/artifacts --out site/dist \
            --extraction-result "$EXTRACTION_RESULT"
          nanoif build canon-pack --repo repo --artifacts site/lib/artifacts --out site/dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v5
