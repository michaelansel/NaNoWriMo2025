name: AI commands

# Slash commands in pull-request comments, collaborators only:
#   /check-continuity [all] [passage=<name>]   re-run the AI editors
#   /extract-story-bible                        Story Bible dry run of the PR merged with main
#   /dismiss f-xxxxxxxx [reason]                record a dismissal on main, re-render comments
# Anything else is ignored. This workflow always runs from the default branch; pull-request
# code only ever runs in the `build` job, whose token is read-only.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number
      command:
        description: The slash command, for example "/check-continuity all"
        required: true
        type: string

permissions: {}

# No workflow-level concurrency: every PR comment starts a run, and a plain "LGTM" must not
# cancel a review in progress. The AI and dismiss jobs set their own groups.

env:
  PYTHON_VERSION: "3.13"
  TWEEGO_VERSION: "2.1.1"
  HARLOWE_VERSION: "3.3.9"
  # Twine 2.10.0 bundles Harlowe 3.3.9; see .github/actions/build-story for why this URL.
  HARLOWE_URL: "https://raw.githubusercontent.com/klembot/twinejs/2.10.0/public/story-formats/harlowe-3.3.9/format.js"
  HARLOWE_SHA256: "803a0d9d4fb8c3c1c99eaf16f37db6feaad72e36fc7e5f6c5a168465419895f3"
  DOTGRAPH_VERSION: "2.2.0"
  # Self-imposed monthly AI spend cap in USD (ADR-023). Empty means the default ($10);
  # "0" stops all paid inference; "off" disables the cap.
  NANOIF_LLM_MONTHLY_USD: ${{ vars.LLM_MONTHLY_USD }}

jobs:
  parse:
    name: parse
    # author_association gates everything that could spend tokens or write state.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # reaction and short replies
      actions: read # find the PR's last ai-review artifact for a passage re-check
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number || inputs.pr }}
      COMMENT_BODY: ${{ github.event.comment.body || inputs.command }}
      COMMENT_ID: ${{ github.event.comment.id }}
      ACTOR: ${{ github.event.comment.user.login || github.actor }}
    outputs:
      command: ${{ steps.cmd.outputs.command }}
      mode: ${{ steps.cmd.outputs.mode }}
      passage: ${{ steps.cmd.outputs.passage }}
      key: ${{ steps.cmd.outputs.key }}
      reason: ${{ steps.cmd.outputs.reason }}
      error: ${{ steps.cmd.outputs.error }}
      pr: ${{ env.PR_NUMBER }}
      actor: ${{ env.ACTOR }}
      same_repo: ${{ steps.pr.outputs.same_repo }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      previous_run: ${{ steps.previous.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .

      - name: Parse the command
        id: cmd
        run: printf '%s' "$COMMENT_BODY" | nanoif github parse-command --github-output "$GITHUB_OUTPUT"

      - name: Authorize (write access or better)
        if: steps.cmd.outputs.command != 'none'
        run: nanoif github authorize --user "$ACTOR"

      - name: Acknowledge
        if: steps.cmd.outputs.command != 'none' && env.COMMENT_ID != ''
        run: nanoif github react --comment-id "$COMMENT_ID" --content eyes

      - name: Look up the pull request
        id: pr
        if: steps.cmd.outputs.command != 'none'
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '
            "same_repo=\(.head.repo.full_name == .base.repo.full_name)",
            "base_ref=\(.base.ref)",
            "head_sha=\(.head.sha)"' >> "$GITHUB_OUTPUT"

      # A passage re-check is merged into the PR's last review (found the same way
      # /dismiss finds it), so one clean passage cannot hide findings on the others.
      - name: Find the last AI review of this pull request
        id: previous
        if: steps.cmd.outputs.command == 'check-continuity' && steps.cmd.outputs.mode == 'passage' && steps.pr.outputs.same_repo == 'true'
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ai-review-pr-${PR_NUMBER}&per_page=20" \
            --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          if [ -z "$run_id" ]; then
            echo "No earlier AI review of PR #${PR_NUMBER}; the passage re-check will be published as partial." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Reply with the usage
        if: steps.cmd.outputs.error != ''
        env:
          ERROR: ${{ steps.cmd.outputs.error }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Nothing ran: $ERROR"

      - name: Reply that fork pull requests are not reviewed
        if: (steps.cmd.outputs.command == 'check-continuity' || steps.cmd.outputs.command == 'extract-story-bible') && steps.pr.outputs.same_repo != 'true'
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Nothing ran: AI commands run only for branches in this repository, not forks."

  build:
    name: build
    needs: parse
    if: needs.parse.outputs.command == 'check-continuity' && needs.parse.outputs.error == '' && needs.parse.outputs.same_repo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This job runs pull-request code: read-only token, no pip cache (cache poisoning).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ needs.parse.outputs.pr }}/head
          fetch-depth: 0
      - uses: ./.github/actions/build-story
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          pip-cache: ""
          base-ref: ${{ needs.parse.outputs.base_ref }}
      - uses: actions/upload-artifact@v7
        with:
          name: story-preview
          path: |
            dist/
            lib/artifacts/
          retention-days: 7

  probe:
    name: probe
    needs: parse
    if: (needs.parse.outputs.command == 'check-continuity' || needs.parse.outputs.command == 'extract-story-bible') && needs.parse.outputs.error == '' && needs.parse.outputs.same_repo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      runner: ${{ steps.probe.outputs.runner }}
      reason: ${{ steps.probe.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
          persist-credentials: false
      - id: probe
        uses: ./.github/actions/probe-runner
        with:
          health-url: ${{ vars.EXE_HEALTH_URL }}
          override: ${{ vars.AI_RUNNER }}

  ai-review:
    name: ai-review
    needs: [parse, build, probe]
    if: needs.parse.outputs.command == 'check-continuity' && needs.parse.outputs.error == '' && needs.parse.outputs.same_repo == 'true'
    runs-on: ${{ needs.probe.outputs.runner == 'exe' && fromJSON('["self-hosted","exe"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    concurrency:
      group: ai-cmd-pr-${{ needs.parse.outputs.pr }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      checks: write
      actions: read # download the PR's last ai-review artifact for a passage re-check
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.parse.outputs.pr }}
    steps:
      # Tooling from the default branch; only the story data comes from the pull request,
      # so no pull-request code runs with this job's write token.
      - uses: actions/checkout@v7
      - name: Take the story files from the pull request
        run: |
          git fetch --no-tags --depth=1 origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          rm -rf src
          git checkout refs/remotes/pr/head -- src
          if git cat-file -e refs/remotes/pr/head:story-overrides.txt 2>/dev/null; then
            git checkout refs/remotes/pr/head -- story-overrides.txt
          fi
      - uses: ./.github/actions/ai-review
        with:
          runner: ${{ needs.probe.outputs.runner }}
          unavailable-reason: ${{ needs.probe.outputs.reason }}
          mode: ${{ needs.parse.outputs.mode }}
          passage: ${{ needs.parse.outputs.passage }}
          pr: ${{ needs.parse.outputs.pr }}
          head-sha: ${{ needs.parse.outputs.head_sha }}
          artifact-name: ai-review-pr-${{ needs.parse.outputs.pr }}
          previous-run-id: ${{ needs.parse.outputs.previous_run }}
          llm-profile: ${{ vars.LLM_PROFILE || 'exe' }}
          llm-model: ${{ vars.LLM_MODEL }}
          python-version: ${{ env.PYTHON_VERSION }}

  ai-review-not-run:
    # The requested review never started (the pull request's build failed, or the probe
    # failed, for example on an invalid vars.AI_RUNNER), so ai-review was skipped. Replace
    # both editor comments and fail both editor checks on the head commit, so an earlier
    # result is never shown as current (AC-continuity-review-28).
    name: ai-review-not-run
    needs: [parse, build, probe]
    if: >-
      !cancelled() && needs.parse.result == 'success' &&
      needs.parse.outputs.command == 'check-continuity' && needs.parse.outputs.error == '' &&
      needs.parse.outputs.same_repo == 'true' &&
      (needs.build.result != 'success' || needs.probe.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.parse.outputs.pr }}
      HEAD_SHA: ${{ needs.parse.outputs.head_sha }}
      BUILD_RESULT: ${{ needs.build.result }}
      PROBE_REASON: ${{ needs.probe.outputs.reason }}
    steps:
      # Default-branch tooling only; no pull-request code runs with this token.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Say the AI review did not run for this request
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            reason="the build failed, so there was nothing to review; the build log in this run says why"
          else
            reason="the AI runner is not set up correctly (${PROBE_REASON:-see the probe job's log}); ask whoever looks after the repository to fix it"
          fi
          nanoif github not-run --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --reason "$reason"
          echo "::error::AI review did not run: $reason"
          exit 1

  bible-dry-run:
    # /extract-story-bible (ADR-020): an incremental extraction of the pull request merged
    # with main, as a dry run that writes nothing under ai/ and commits nothing. The result,
    # or "did not run" with the reason, is the <!-- nano:bible --> sticky comment; when the
    # run did not happen or failed, the job fails too.
    name: bible-dry-run
    needs: [parse, probe]
    if: >-
      !cancelled() && needs.parse.result == 'success' &&
      needs.parse.outputs.command == 'extract-story-bible' && needs.parse.outputs.error == '' &&
      needs.parse.outputs.same_repo == 'true'
    runs-on: ${{ needs.probe.outputs.runner == 'exe' && fromJSON('["self-hosted","exe"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    concurrency:
      group: ai-cmd-pr-${{ needs.parse.outputs.pr }}-bible
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write # the Story Bible sticky comment
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.parse.outputs.pr }}
      RUNNER_KIND: ${{ needs.probe.result == 'success' && needs.probe.outputs.runner || 'none' }}
      PROBE_REASON: ${{ needs.probe.outputs.reason }}
      NANOIF_LLM_PROFILE: ${{ vars.LLM_PROFILE || 'exe' }}
      NANOIF_LLM_MODEL: ${{ vars.LLM_MODEL }}
    steps:
      # Tooling from the default branch; only the story data (src/, story-overrides.txt and
      # main's saved cache, as the merge ref carries them) comes from the pull request, so no
      # pull-request code runs with this job's token (contents: read).
      - uses: actions/checkout@v7
      - name: Python venv (exe runner)
        if: env.RUNNER_KIND == 'exe'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Set up Python (hosted)
        if: env.RUNNER_KIND != 'exe'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install nanoif
        run: python -m pip install -e .
      - name: Say the dry run did not run
        if: env.RUNNER_KIND != 'exe'
        run: |
          if [ "$RUNNER_KIND" = none ]; then
            reason="the AI runner is not set up correctly (${PROBE_REASON:-see the probe job's log}); ask whoever looks after the repository to fix it"
          else
            reason="${PROBE_REASON:-the exe runner is not available}"
          fi
          nanoif github bible-report --pr "$PR_NUMBER" --reason "$reason"
          echo "::error::/extract-story-bible did not run: $reason"
          exit 1
      - name: Take the story files from the pull request merged with main
        id: merge
        if: env.RUNNER_KIND == 'exe'
        run: |
          git fetch --no-tags --depth=1 origin "+refs/pull/${PR_NUMBER}/merge:refs/remotes/pr/merge"
          rm -rf src ai/story-bible-cache.json story-overrides.txt
          git checkout refs/remotes/pr/merge -- src
          for path in story-overrides.txt ai/story-bible-cache.json; do
            if git cat-file -e "refs/remotes/pr/merge:$path" 2>/dev/null; then
              git checkout refs/remotes/pr/merge -- "$path"
            fi
          done
      - name: Dry-run the extraction
        id: extract
        if: env.RUNNER_KIND == 'exe'
        run: |
          set +e
          nanoif bible extract --repo . --incremental --dry-run --diff-out "$RUNNER_TEMP/bible-diff.json" > "$RUNNER_TEMP/bible.txt" 2> "$RUNNER_TEMP/bible-err.txt"
          code=$?
          set -e
          cat "$RUNNER_TEMP/bible.txt" "$RUNNER_TEMP/bible-err.txt"
          cat "$RUNNER_TEMP/bible.txt" "$RUNNER_TEMP/bible-err.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Post the Story Bible comment
        # Runs even when an earlier step failed: a comment-triggered run is not among the
        # pull request's checks, so this comment is the only place a writer sees the result.
        if: ${{ !cancelled() && env.RUNNER_KIND == 'exe' }}
        env:
          CODE: ${{ steps.extract.outputs.exit_code }}
          MERGE: ${{ steps.merge.outcome }}
        run: |
          if [ "$MERGE" != success ]; then
            CODE="${CODE:-1}"
            nanoif github bible-report --pr "$PR_NUMBER" --reason "could not merge the pull request with main; resolve its conflicts, then comment again"
          elif [ -f "$RUNNER_TEMP/bible-diff.json" ] && { [ "$CODE" = 0 ] || [ "$CODE" = 3 ]; }; then
            nanoif github bible-report --pr "$PR_NUMBER" --diff "$RUNNER_TEMP/bible-diff.json"
          else
            reason=""
            if [ -f "$RUNNER_TEMP/bible-err.txt" ]; then reason="$(tail -n 1 "$RUNNER_TEMP/bible-err.txt")"; fi
            nanoif github bible-report --pr "$PR_NUMBER" --reason "${reason:-the extraction exited ${CODE:-without an exit code} and gave no reason}"
          fi
          if [ "${CODE:-1}" != 0 ]; then
            echo "::error::/extract-story-bible exited $CODE; the comment says what did not happen."
            exit 1
          fi

  dismiss:
    name: dismiss
    needs: parse
    if: needs.parse.outputs.command == 'dismiss' && needs.parse.outputs.error == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One writer of ai/ on main at a time; never cancelled.
    concurrency:
      group: ai-state-main
      cancel-in-progress: false
    permissions:
      contents: write # append ai/dismissals.jsonl on the default branch only
      pull-requests: write
      checks: write
      actions: read # find and download the PR's last ai-review artifact
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.parse.outputs.pr }}
      KEY: ${{ needs.parse.outputs.key }}
      REASON: ${{ needs.parse.outputs.reason }}
      ACTOR: ${{ needs.parse.outputs.actor }}
      HEAD_SHA: ${{ needs.parse.outputs.head_sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .

      - name: Fetch the last AI review of this pull request
        id: artifact
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ai-review-pr-${PR_NUMBER}&per_page=20" \
            --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -z "$run_id" ]; then
            echo "::error::No unexpired ai-review-pr-${PR_NUMBER} artifact; nothing recorded."
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "ai-review-pr-${PR_NUMBER}" --dir "$RUNNER_TEMP/review"
          echo "review=$RUNNER_TEMP/review/ai-review.json" >> "$GITHUB_OUTPUT"
          echo "head_sha_file=$RUNNER_TEMP/review/ai-review-head-sha.txt" >> "$GITHUB_OUTPUT"

      # Refuses (exit 1, nothing written) when the key is not in that review: a line
      # without passage hashes would suppress the finding even after the passages change.
      - name: Record the dismissal
        id: record
        env:
          REVIEW: ${{ steps.artifact.outputs.review }}
        run: |
          nanoif github dismiss --key "$KEY" --by "$ACTOR" --pr "$PR_NUMBER" \
            --reason "$REASON" --review "$REVIEW" --out ai/dismissals.jsonl

      - name: Commit to the default branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/dismissals.jsonl
          git commit -m "chore: record dismissal of ${KEY} from PR #${PR_NUMBER}"
          if ! git push origin "HEAD:${DEFAULT_BRANCH}"; then
            echo "Push rejected; rebasing once onto the new ${DEFAULT_BRANCH}"
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi

      # Only a review of the current head is re-rendered (ADR-022): after a newer push, or a
      # "did not run" notice, the stored review is an older commit's and would pose as current.
      - name: Re-render the AI comments (no LLM)
        id: rerender
        env:
          REVIEW: ${{ steps.artifact.outputs.review }}
          REVIEW_HEAD_SHA_FILE: ${{ steps.artifact.outputs.head_sha_file }}
        run: |
          nanoif github report --pr "$PR_NUMBER" --review "$REVIEW" \
            --dismissals ai/dismissals.jsonl \
            --review-head-sha-file "$REVIEW_HEAD_SHA_FILE" --head-sha "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Reply when the last review is not of the current commit
        if: steps.rerender.outputs.rendered == 'false'
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Dismissed \`${KEY}\`. The last AI review is not of the latest commit, so the comments were left as they are; the next review will show the dismissal."

      - name: Reply when nothing could be recorded
        if: failure() && (steps.artifact.outcome == 'failure' || steps.record.outcome == 'failure')
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Could not dismiss \`${KEY}\`: no review result for this pull request is available, or the key is not in it. Nothing was recorded. Run \`/check-continuity\`, then \`/dismiss\` again."
