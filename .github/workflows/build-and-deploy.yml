name: Build and deploy

# Pull requests: test, build + Structure check, probe, AI review (exe runner).
# Main: test, build, (Story Bible extraction, Phase 3), deploy to Pages.
# Nothing here pushes to a pull request branch.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  TWEEGO_VERSION: "2.1.1"
  HARLOWE_VERSION: "3.3.9"
  # Twine 2.10.0 bundles Harlowe 3.3.9; see .github/actions/build-story for why this URL.
  HARLOWE_URL: "https://raw.githubusercontent.com/klembot/twinejs/2.10.0/public/story-formats/harlowe-3.3.9/format.js"
  HARLOWE_SHA256: "803a0d9d4fb8c3c1c99eaf16f37db6feaad72e36fc7e5f6c5a168465419895f3"
  DOTGRAPH_VERSION: "2.2.0"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check nanoif tests
      - name: Test
        run: pytest

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # Build & Structure sticky comment (PRs only)
      checks: write # Structure check run (PRs only)
    env:
      # Fork PRs get a read-only token: they report to the step summary only.
      PR_NUMBER: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number || '' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: path categorization and file dates read git log.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Lint twee formatting (report-only)
        # Issues become warning annotations and a step-summary line; nothing edits the
        # writer's files. Exit 1 with the summary line means "issues found"; anything
        # else is the linter failing, which fails the job.
        run: |
          set +e
          nanoif lint src/ --format github 2> "$RUNNER_TEMP/lint.txt"
          code=$?
          set -e
          cat "$RUNNER_TEMP/lint.txt"
          if [ "$code" -ne 0 ] && ! grep -q "formatting issue" "$RUNNER_TEMP/lint.txt"; then
            exit "$code"
          fi
          echo "Twee formatting (report-only): $(tail -n 1 "$RUNNER_TEMP/lint.txt")" >> "$GITHUB_STEP_SUMMARY"

      - name: Check story structure
        id: structure
        # --exit-zero: errors are reported by the Structure check run (failure on PRs) and
        # the step summary on main, and must not skip the build below.
        run: |
          mkdir -p dist
          nanoif check structure src/ --format json --exit-zero > dist/structure.json
          if [ -z "$PR_NUMBER" ]; then
            nanoif check structure src/ --format github --exit-zero
          fi

      - name: Build story
        id: build
        uses: ./.github/actions/build-story
        with:
          install-python: "false"
          base-ref: ${{ github.base_ref }}

      - name: Build & Structure report
        if: ${{ !cancelled() && steps.structure.outcome == 'success' }}
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          args=(--structure dist/structure.json --dist dist --build-outcome "$BUILD_OUTCOME")
          if [ -n "$PR_NUMBER" ]; then args+=(--pr "$PR_NUMBER" --head-sha "$HEAD_SHA"); fi
          nanoif github build-report "${args[@]}"

      - name: Upload story preview
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: story-preview
          path: |
            dist/
            lib/artifacts/
          retention-days: 30

  probe:
    name: probe
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      runner: ${{ steps.probe.outputs.runner }}
      reason: ${{ steps.probe.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
          persist-credentials: false
      - id: probe
        uses: ./.github/actions/probe-runner
        with:
          health-url: ${{ vars.EXE_HEALTH_URL }}
          override: ${{ vars.AI_RUNNER }}

  ai-review:
    name: ai-review
    needs: [build, probe]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ needs.probe.outputs.runner == 'exe' && fromJSON('["self-hosted","exe"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write # Continuity and Style sticky comments
      checks: write # Continuity Editor and Style Editor check runs
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ai-review
        with:
          runner: ${{ needs.probe.outputs.runner }}
          unavailable-reason: ${{ needs.probe.outputs.reason }}
          mode: changed
          pr: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          artifact-name: ai-review-pr-${{ github.event.pull_request.number }}
          llm-profile: ${{ vars.LLM_PROFILE || 'exe' }}
          llm-model: ${{ vars.LLM_MODEL }}
          python-version: ${{ env.PYTHON_VERSION }}

  bible-extract:
    # PLACEHOLDER until Phase 3. The real job runs `nanoif bible extract --incremental` on
    # [self-hosted, exe] behind the probe, with contents: write, and commits
    # ai/story-bible-cache.json to main (pull --rebase retry once). Off unless
    # vars.BIBLE_EXTRACT == 'true'.
    name: bible-extract
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.BIBLE_EXTRACT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Placeholder
        run: echo "Story Bible extraction lands in Phase 3" | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy
    needs: [build, bible-extract]
    # Deploy even when extraction failed or was skipped: the site renders the previous cache.
    if: ${{ always() && needs.build.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: story-preview
          path: site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v5
