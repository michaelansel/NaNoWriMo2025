name: Build story
description: >-
  Install nanoif, tweego and the pinned story formats, then build dist/ (play, proofread,
  graph, allpaths, metrics, story bible, passages, landing) and lib/artifacts/.
  Reads TWEEGO_VERSION, HARLOWE_VERSION, HARLOWE_URL, HARLOWE_SHA256 and DOTGRAPH_VERSION
  from the calling workflow's top-level env block.

inputs:
  install-python:
    description: Set up Python and install nanoif ("false" when the job already did).
    default: "true"
  python-version:
    description: Python for actions/setup-python.
    default: "3.13"
  pip-cache:
    description: >-
      setup-python cache mode. Pass "" when building untrusted code in a default-branch
      context (issue_comment), so the pip cache cannot be poisoned.
    default: pip
  base-ref:
    description: >-
      Branch to categorize paths against (the pull request's base). Empty on main and
      for local-style builds, which categorize against HEAD.
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      if: inputs.install-python == 'true'
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.pip-cache }}

    - name: Install nanoif
      if: inputs.install-python == 'true'
      shell: bash
      run: python -m pip install -e ".[dev]"

    - name: Check pinned versions
      shell: bash
      run: |
        : "${TWEEGO_VERSION:?set TWEEGO_VERSION in the workflow env block}"
        : "${HARLOWE_VERSION:?set HARLOWE_VERSION in the workflow env block}"
        : "${HARLOWE_URL:?set HARLOWE_URL in the workflow env block}"
        : "${HARLOWE_SHA256:?set HARLOWE_SHA256 in the workflow env block}"
        : "${DOTGRAPH_VERSION:?set DOTGRAPH_VERSION in the workflow env block}"
        echo "tweego ${TWEEGO_VERSION}, Harlowe ${HARLOWE_VERSION}, dotgraph ${DOTGRAPH_VERSION}"

    - name: Install tweego
      shell: bash
      run: |
        dir="$RUNNER_TEMP/tweego"
        mkdir -p "$dir"
        curl -fsSL --retry 3 -o "$dir/tweego.zip" \
          "https://github.com/tmedwards/tweego/releases/download/v${TWEEGO_VERSION}/tweego-${TWEEGO_VERSION}-linux-x64.zip"
        unzip -q -o "$dir/tweego.zip" -d "$dir"
        chmod +x "$dir/tweego"
        echo "$dir" >> "$GITHUB_PATH"
        # Story formats live in the repository root (gitignored), where scripts/build-core.sh
        # and local builds look for them too.
        rm -rf storyformats
        mv "$dir/storyformats" storyformats
        echo "TWEEGO_PATH=$PWD/storyformats" >> "$GITHUB_ENV"

    - name: Install Harlowe (pinned; replaces tweego's bundled 3.1.0)
      # Harlowe's own releases are on foss.heptapod.net, whose assets have no stable URL.
      # Twine ships each Harlowe release as public/story-formats/harlowe-<version>/format.js
      # in the twinejs repository, so HARLOWE_URL points at the Twine tag that bundles the
      # pinned version and HARLOWE_SHA256 guards the file. To move to a new Harlowe, find the
      # twinejs tag that bundles it, update all three variables together, and re-run
      # `sha256sum` on the downloaded file.
      shell: bash
      run: |
        dest="storyformats/harlowe-${HARLOWE_VERSION}"
        mkdir -p "$dest"
        curl -fsSL --retry 3 -o "$dest/format.js" "$HARLOWE_URL"
        echo "${HARLOWE_SHA256}  $dest/format.js" | sha256sum -c -
        if ! grep -q "\"version\":\"${HARLOWE_VERSION}\"" "$dest/format.js"; then
          echo "::error::$HARLOWE_URL is not Harlowe ${HARLOWE_VERSION}"
          exit 1
        fi

    - name: Install dotgraph
      shell: bash
      run: |
        dir="$RUNNER_TEMP/dotgraph"
        mkdir -p "$dir"
        curl -fsSL --retry 3 -o "$dir/dotgraph.zip" \
          "https://github.com/mcdemarco/dotgraph/releases/download/v${DOTGRAPH_VERSION}/release.zip"
        unzip -q -o "$dir/dotgraph.zip" -d "$dir"
        # The online dotgraph-2 format, not the offline one.
        mv "$dir/dotgraph-2" storyformats/

    - name: Find the merge base for path categorization
      if: inputs.base-ref != ''
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
      run: |
        git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
        merge_base=$(git merge-base HEAD "origin/${BASE_REF}")
        echo "Categorizing against origin/${BASE_REF} at merge base ${merge_base}"
        echo "GITHUB_MERGE_BASE=${merge_base}" >> "$GITHUB_ENV"

    - name: Build
      shell: bash
      run: |
        mkdir -p dist
        # PathIdLookup.twee is generated from the graph; a stale copy must not be compiled in.
        rm -f src/PathIdLookup.twee
        tweego src -o dist/story-paperthin.html -f paperthin-1
        nanoif build all --repo .
        tweego src -o dist/play.html -f "harlowe-${HARLOWE_VERSION}"
        tweego src -o dist/proofread.html -f paperthin-1
        tweego src -o dist/graph.html -f dotgraph-2
